name: Update cloudflared-web version

on:
  schedule:
    # Check for new releases daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get latest release from cloudflare/cloudflared
        id: latest_release
        run: |
          # Fetch the latest release tag from cloudflare/cloudflared repo
          LATEST_VERSION=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name')
          echo "Latest version: $LATEST_VERSION"
          
          # Validate version matches pattern ^\d+\.\d+\.\d+$
          if [[ ! $LATEST_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version does not match pattern: $LATEST_VERSION"
            exit 1
          fi
          
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Get current version from Dockerfile
        id: current_version
        run: |
          CURRENT_VERSION=$(grep -oP '(?<=ARG CLOUDFLARED_VERSION=).*' Dockerfile)
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check_update
        run: |
          if [ "${{ steps.latest_release.outputs.latest_version }}" != "${{ steps.current_version.outputs.current_version }}" ]; then
            echo "Update needed from ${{ steps.current_version.outputs.current_version }} to ${{ steps.latest_release.outputs.latest_version }}"
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "Already at latest version: ${{ steps.current_version.outputs.current_version }}"
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update VERSION in Dockerfiles
        if: steps.check_update.outputs.update_needed == 'true'
        run: |
          NEW_VERSION="${{ steps.latest_release.outputs.latest_version }}"
          
          # Update main Dockerfile
          sed -i "s/ARG CLOUDFLARED_VERSION=.*/ARG CLOUDFLARED_VERSION=$NEW_VERSION/" Dockerfile
          
          # Update dev/Dockerfile
          sed -i "s/ARG CLOUDFLARED_VERSION=.*/ARG CLOUDFLARED_VERSION=$NEW_VERSION/" dev/Dockerfile
          
          echo "Updated Dockerfiles to version $NEW_VERSION"

      - name: Create Pull Request
        if: steps.check_update.outputs.update_needed == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Bump cloudflared version to ${{ steps.latest_release.outputs.latest_version }}"
          committer: WisdomSky <i.wisdomsky@gmail.com>
          author: WisdomSky <i.wisdomsky@gmail.com>
          title: "chore: Bump cloudflared version into ${{ steps.latest_release.outputs.latest_version }}"
          body: |
            Automated version update for cloudflared-web
            
            - Previous version: ${{ steps.current_version.outputs.current_version }}
            - New version: ${{ steps.latest_release.outputs.latest_version }}
            
            Release notes: https://github.com/cloudflare/cloudflared/releases/tag/${{ steps.latest_release.outputs.latest_version }}
          branch: version/${{ steps.latest_release.outputs.latest_version }}
          delete-branch: true

      - name: Enable auto-merge
        if: steps.check_update.outputs.update_needed == 'true' && steps.create_pr.outputs.pull-request-number
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger Github workflow
        if: steps.check_update.outputs.update_needed == 'true'
        # You may pin to the exact commit or the version.
        # uses: yakubique/trigger-github-workflow@5dcfcea92d62b4723e3cbad8bc1c415b654d1007
        uses: yakubique/trigger-github-workflow@v1
        with:
          # Owner/repository
          repository: WisdomSky/Cloudflared-web
          # Workflow ID or workflow's filename
          workflow: publish.yml
          # Github token
          token: ${{ secrets.GITHUB_TOKEN }}
          # Reference branch
          ref: main
